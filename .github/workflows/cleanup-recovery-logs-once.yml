name: Cleanup temporary Premium recovery logs

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-recovery-logs-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup-temporary-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary recovery run logs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for run_id in 39664742618 39664821891 39664928054 39665044659 39665141018 39665224005; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/magickidsok/magickidsok.github.io/actions/runs/${run_id}")"
            if [[ "$code" == "204" || "$code" == "200" || "$code" == "404" ]]; then
              echo "Temporary run ${run_id}: HTTP ${code}"
            else
              echo "::warning::Could not delete temporary run ${run_id}; HTTP ${code}"
            fi
          done
