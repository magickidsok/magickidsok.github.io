name: Recover MAGIC KIDS approved Premium names (one-time)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-premium-users-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-approved-nicknames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read approved nicknames from Cloudflare D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error("Cloudflare API token is not available in repository Actions secrets.");
          const api = "https://api.cloudflare.com/client/v4";
          const headers = { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
          async function get(path) {
            const response = await fetch(api + path, { headers });
            let data;
            try { data = await response.json(); } catch { data = {}; }
            return { response, data };
          }
          const accountsResult = await get("/accounts?per_page=100");
          if (!accountsResult.response.ok || accountsResult.data.success !== true) {
            const detail = (accountsResult.data.errors || []).map(e => e.code + ": " + e.message).join("; ");
            throw new Error("Cloudflare account discovery failed: " + detail);
          }
          let accountId = null;
          for (const account of accountsResult.data.result || []) {
            const scripts = await get(`/accounts/${account.id}/workers/scripts?per_page=100`);
            if (scripts.response.ok && scripts.data.success === true &&
                (scripts.data.result || []).some(worker => worker.id === "magickidsok-github-io")) {
              accountId = account.id;
              break;
            }
          }
          if (!accountId) throw new Error("The existing MAGIC KIDS Worker was not found in any account accessible to the configured token.");
          const dbResult = await get(`/accounts/${accountId}/d1/database?per_page=100`);
          if (!dbResult.response.ok || dbResult.data.success !== true) {
            const detail = (dbResult.data.errors || []).map(e => e.code + ": " + e.message).join("; ");
            throw new Error("Cloudflare could not list D1 databases in the Worker account: " + detail);
          }
          const database = (dbResult.data.result || []).find(db => db.name === "magic-kids-chat-db");
          if (!database) {
            const names = (dbResult.data.result || []).map(db => db.name).filter(Boolean);
            throw new Error("The expected legacy D1 database was not found. Available names: " + JSON.stringify(names));
          }
          const databaseId = database.uuid || database.id;
          const sql = "SELECT username FROM mk_premium_chat_users UNION SELECT username FROM mk_premium_chat_requests WHERE status = 'approved' ORDER BY username";
          const queryResult = await fetch(`${api}/accounts/${accountId}/d1/database/${databaseId}/query`, {
            method: "POST", headers, body: JSON.stringify({ sql, params: [] })
          });
          const data = await queryResult.json();
          if (!queryResult.ok || data.success !== true) {
            const detail = (data.errors || []).map(e => e.code + ": " + e.message).join("; ");
            throw new Error("Cloudflare D1 query failed: " + detail);
          }
          const rows = (data.result || []).flatMap(result => Array.isArray(result.results) ? result.results : []);
          const names = [...new Set(rows.map(row => String(row.username || "").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
          console.log("APPROVED_NICKNAMES_JSON=" + JSON.stringify(names));
          console.log("APPROVED_NICKNAMES_COUNT=" + names.length);
          if (names.length === 0) console.log("No approved usernames were found in the legacy D1 tables.");
          NODE
