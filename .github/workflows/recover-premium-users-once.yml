name: Recover MAGIC KIDS approved Premium names (one-time)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/recover-premium-users-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-approved-nicknames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Read approved nicknames only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare read credentials are not available in repository Actions secrets."
            exit 1
          fi
          npx wrangler d1 execute magic-kids-chat-db --remote --json --command "SELECT username FROM mk_premium_chat_users UNION SELECT username FROM mk_premium_chat_requests WHERE status = 'approved' ORDER BY username" > /tmp/approved-nicknames.json
          node --input-type=module -e '
            import fs from "node:fs";
            const raw = fs.readFileSync("/tmp/approved-nicknames.json", "utf8");
            const parsed = JSON.parse(raw);
            const rows = [];
            const walk = value => {
              if (Array.isArray(value)) { for (const item of value) walk(item); return; }
              if (!value || typeof value !== "object") return;
              if (Array.isArray(value.results)) {
                for (const row of value.results) {
                  if (row && typeof row.username === "string" && row.username.trim()) rows.push(row.username.trim());
                }
              }
              for (const [key, child] of Object.entries(value)) if (key !== "results") walk(child);
            };
            walk(parsed);
            const names = [...new Set(rows)].sort((a,b)=>a.localeCompare(b));
            console.log("APPROVED_NICKNAMES_JSON=" + JSON.stringify(names));
            console.log("APPROVED_NICKNAMES_COUNT=" + names.length);
            if (names.length === 0) console.log("No approved usernames were found in the legacy D1 tables.");
          '
