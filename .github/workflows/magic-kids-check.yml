name: Magic Kids syntax and integration check
on:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check magic-public.js
      - run: node --check magic-panel/app.js
      - run: node --check magic-config.js
      - shell: bash
        run: "! grep -q 'settings();' magic-public.js"
      - shell: bash
        run: "grep -q 'magic-player-logo.webp' index.html"
      - shell: bash
        run: "grep -q \"chat-api\" magic-config.js"
      - name: Check playout API
        shell: bash
        run: |
          node <<'NODE'
          const u='https://uifchrnvigkzantaehgz.supabase.co/functions/v1/magic-kids-panel-api?resource=playout';
          const r=await fetch(u,{cache:'no-store'});
          if(!r.ok) throw new Error('playout API HTTP '+r.status);
          const d=await r.json();
          if(!['off_air','playing','paused'].includes(d.status)) throw new Error('invalid playout status');
          console.log(JSON.stringify({status:d.status,generation:d.generation,totalVideos:d.totalVideos}));
          NODE
