name: Build MAGIC KIDS TV APK

on:
  push:
    branches:
      - magic-kids-tv-apk-final
    paths:
      - "_android_build/trigger.txt"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Android build branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Reconstruct project archive
        run: |
          cat _android_build/chunks/part-*.b64 | tr -d '\n' | base64 -d > _android_build/project.zip
          unzip -q _android_build/project.zip -d _android_build
      - name: Build debug APK
        working-directory: _android_build/MAGIC_KIDS_TV_Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAGIC-KIDS-TV-APK
          path: _android_build/MAGIC_KIDS_TV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
