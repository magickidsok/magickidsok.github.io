plugins {
    id 'com.android.application'
}

android {
    namespace 'com.magickids.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.magickids.tv'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
        }
    }
}
