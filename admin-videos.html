<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Magic Kids — Panel</title>
<link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#080522;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid #342070;padding-bottom:14px}
.logo{font-size:28px;font-weight:900;color:#ffd400;text-shadow:2px 2px #111}.muted{color:#aaa}.pill{border:1px solid #7b3cff;border-radius:999px;padding:7px 12px;font-size:12px}
.card{background:#100a3a;border:1px solid #4c2a9a;border-radius:16px;padding:18px;margin-top:16px}.login{max-width:430px;margin:90px auto}
input,select,button{font:inherit}input,select{width:100%;background:#080522;color:#fff;border:1px solid #49358b;border-radius:10px;padding:12px;margin:6px 0}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:#7b35ff;color:#fff}button.red{background:#c62828}button.gray{background:#2c2750}button.green{background:#159447}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:150px}.hidden{display:none!important}
.msg{min-height:22px;color:#ffd400;font-size:13px;margin-top:8px}.status{color:#6cff9c}.danger{color:#ff7070}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.video{background:#0a0628;border:1px solid #302067;border-radius:12px;padding:12px}.video h3{font-size:15px;margin:8px 0}.video small{color:#999}
.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;padding:9px;font-size:12px}
#playerBox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#playerBox .inner{width:min(900px,96vw);background:#09052a;padding:12px;border-radius:14px}
#playerBox video{width:100%}.close{float:right;margin-bottom:8px}
progress{width:100%;height:8px}
@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}.login{margin:40px auto}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><div class="logo">MAGIC KIDS</div><div>Panel privado de videos · MP4 / Range 206</div></div><div class="row" style="justify-content:flex-end"><span class="pill">FOX KIDS / MP4 / RANGE 206</span><span id="server" class="pill">● comprobando…</span></div></header>

<section id="login" class="card login">
<h2 style="margin-top:0">Panel Magic Kids</h2>
<p class="muted">Acceso protegido con código maestro 1991.</p>
<input id="code" type="password" inputmode="numeric" placeholder="Código del panel">
<button id="enter" style="width:100%">INGRESAR</button>
<div id="loginMsg" class="msg"></div>
</section>

<main id="app" class="hidden">
<section class="card">
<div class="row">
<div><b>Biblioteca</b><div class="muted">MP4 directo con reproducción rápida.</div></div>
<button id="refresh" class="gray">Actualizar</button>
<button id="purge" class="red">Borrar TODOS los videos</button>
</div>
<div class="row" style="margin-top:10px"><input id="search" placeholder="Buscar video…" autocomplete="off"><button id="prev" class="gray">‹</button><button id="next" class="gray">›</button></div>
<div id="count" class="msg"></div>
<div id="videos" class="grid"></div>
</section>

<section class="card">
<h3>Subir video</h3>
<div class="row">
<input id="file" type="file" accept="video/mp4,video/*">
<input id="title" placeholder="Título (opcional)">
</div>
<div class="row">
<select id="category"><option value="">Sin categoría</option></select>
<select id="type"><option value="program">Programa</option><option value="commercial">Publicidad</option></select>
<button id="upload">SUBIR</button>
</div>
<progress id="progress" value="0" max="100" class="hidden"></progress>
<div id="uploadMsg" class="msg"></div>
</section>

<section class="card">
<h3>Canal</h3>
<div class="row">
<button data-channel="start" class="green">▶ INICIAR</button>
<button data-channel="restart">↻ REINICIAR</button>
<button data-channel="offair" class="gray">OFF AIR</button>
<button data-channel="stop" class="red">■ DETENER</button>
</div>
<div id="channel" class="msg">Estado: comprobando…</div>
</section>

<section class="card">
<h3>Programación</h3>
<div id="schedule"></div>
<button id="addSchedule" class="gray" style="margin-top:10px">+ AGREGAR BLOQUE</button><button id="saveSchedule" class="green" style="margin-top:10px">GUARDAR PROGRAMACIÓN</button>
<div id="scheduleMsg" class="msg"></div>
</section>
</main>
</div>

<div id="playerBox"><div class="inner"><button class="close red" onclick="closePlayer()">CERRAR</button><video id="preview" controls playsinline></video></div></div>
<script src="https://cdn.plyr.io/3.8.4/plyr.min.js"></script>
<script>
const API="https://magickidsok-github-io.elmagickids.workers.dev";
const $=id=>document.getElementById(id);
let videos=[],categories=[],plyr=null,videoPage=0;const PAGE_SIZE=30;

async function api(path,opt={}){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),10000);
  try{
    const sep=path.includes("?")?"&":"?";
    const r=await fetch(API+path+sep+"_="+Date.now(),{cache:"no-store",credentials:"include",...opt,signal:c.signal});
    let d={};try{d=await r.json()}catch(_){}
    if(!r.ok)throw Error(d.error||("Error "+r.status));
    return d;
  }catch(e){
    if(e.name==="AbortError")throw Error("El servidor tardó demasiado en responder.");
    throw e;
  }finally{clearTimeout(t)}
}
async function boot(){
  try{
    const h=await fetch(API+"/api/health?_"+Date.now(),{cache:"no-store"});
    $("server").textContent=h.ok?"● SERVIDOR: ONLINE":"● SERVIDOR: ERROR";
  }catch(e){$("server").textContent="● SERVIDOR: OFFLINE"}
  try{
    const m=await api("/api/me");
    if(m.user?.isAdmin){showApp();await loadAll()}
  }catch(e){}
}
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden")}
$("enter").onclick=async()=>{
  const msg=$("loginMsg");msg.textContent="Conectando…";
  try{
    const accessCode=$("code").value.trim();let logged=false;try{await api("/api/admin/master-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:accessCode}));logged=true}catch(masterErr){try{await api("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin:accessCode})});logged=true}catch(pinErr){throw new Error(masterErr.message||pinErr.message||"Código incorrecto.")}}
    showApp();msg.textContent="";await loadAll();
  }catch(e){msg.textContent=e.message}
};
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")$("enter").click()});
async function loadAll(){await Promise.all([loadVideos(),loadCategories(),loadSchedule(),loadChannel()])}
async function loadVideos(){
  const d=await api("/api/videos");videos=d.videos||[];videoPage=0;renderVideos();
}
function renderVideos(){
  const q=$("search")?.value.trim().toLowerCase()||"";
  const filtered=q?videos.filter(v=>String(v.title||"").toLowerCase().includes(q)||String(v.category||"").toLowerCase().includes(q)||String(v.id).includes(q)):videos;
  const pages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));videoPage=Math.min(videoPage,pages-1);
  const start=videoPage*PAGE_SIZE,items=filtered.slice(start,start+PAGE_SIZE);
  $("count").textContent=filtered.length+" videos · página "+(videoPage+1)+"/"+pages;
  $("prev").disabled=videoPage<=0;$("next").disabled=videoPage>=pages-1;
  $("videos").innerHTML=items.map(v=>'<article class="video"><small>#'+v.id+' · '+(v.category||"Sin categoría")+'</small><h3>'+esc(v.title)+'</h3><small>'+fmt(v.duration_seconds)+'</small><div class="actions"><button onclick="playVideo('+v.id+')">▶ VER</button><button class="red" onclick="delVideo('+v.id+')">BORRAR</button></div></article>').join("")||'<div class="muted">No hay videos.</div>';
}
async function loadCategories(){
  const d=await api("/api/admin/categories");categories=d.categories||[];
  $("category").innerHTML='<option value="">Sin categoría</option>'+categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("");
}
async function loadSchedule(){
  const d=await api("/api/admin/schedule");const s=d.schedule||[];const rows=s.length?s:[{start_time:"00:00",video_id:videos[0]?.id,title:videos[0]?.title||""}];
  $("schedule").innerHTML=rows.map((x,i)=>'<div class="row" style="margin:6px 0"><input class="stime" value="'+esc(x.start_time||"00:00")+'" placeholder="HH:MM"><select class="svid"></select></div>').join("");
  const selects=[...document.querySelectorAll(".svid")];
  selects.forEach((sel,i)=>{sel.innerHTML=videos.map(v=>'<option value="'+v.id+'" '+((s[i]?.video_id||rows[i]?.video_id)==v.id?"selected":"")+'>'+esc(v.title)+'</option>').join("")});
}
async function loadChannel(){try{const d=await api("/api/channel/state");$("channel").textContent="Estado: "+d.status}catch(e){$("channel").textContent="Estado: error"}}
function playVideo(id){const v=videos.find(x=>x.id==id);if(!v)return;$("playerBox").style.display="flex";$("preview").src=API+"/media/"+String(v.object_key||"").split("/").map(encodeURIComponent).join("/");if(plyr)plyr.destroy();plyr=new Plyr("#preview",{controls:["play-large","play","progress","current-time","mute","volume","settings","fullscreen"],settings:["speed"],speed:{selected:1,options:[.75,1,1.25,1.5,2]}});$("preview").play().catch(()=>{})}
function closePlayer(){if(plyr){plyr.stop();plyr.destroy();plyr=null}$("preview").removeAttribute("src");$("preview").load();$("playerBox").style.display="none"}
async function delVideo(id){if(!confirm("¿Borrar este video?"))return;try{await api("/api/admin/video/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});await loadVideos();await loadSchedule()}catch(e){alert(e.message)}}
$("purge").onclick=async()=>{if(!videos.length)return alert("No hay videos.");if(!confirm("ATENCIÓN: se borrarán TODOS los videos del panel. ¿Continuar?"))return;if(!confirm("Última confirmación: borrar "+videos.length+" videos?"))return;for(let i=0;i<videos.length;i++){try{await api("/api/admin/video/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:videos[i].id})});$("count").textContent="Borrando "+(i+1)+"/"+videos.length}catch(e){alert("Se detuvo en el video "+(i+1)+": "+e.message);break}}await loadAll()}
$("upload").onclick=async()=>{
  const f=$("file").files[0];if(!f)return $("uploadMsg").textContent="Elegí un video.";
  const msg=$("uploadMsg");msg.textContent="Subiendo…";$("progress").classList.remove("hidden");$("progress").value=0;
  try{
    const fd=new FormData();fd.append("file",f);fd.append("title",$("title").value);fd.append("categoryId",$("category").value);fd.append("videoType",$("type").value);
    const r=await fetch(API+"/api/admin/upload?_"+Date.now(),{method:"POST",body:fd,credentials:"include"});
    let d={};try{d=await r.json()}catch(_){}
    if(!r.ok)throw Error(d.error||"No se pudo subir");
    $("progress").value=100;msg.textContent="Video subido."; $("file").value="";$("title").value="";await loadVideos();
  }catch(e){msg.textContent=e.message}
};
document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=async()=>{try{await api("/api/admin/channel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:b.dataset.channel})});await loadChannel()}catch(e){alert(e.message)}});
$("addSchedule").onclick=()=>{const box=$("schedule");const row=document.createElement("div");row.className="row";row.style.margin="6px 0";row.innerHTML='<input class="stime" value="00:00" placeholder="HH:MM"><select class="svid">'+videos.map(v=>'<option value="'+v.id+'">'+esc(v.title)+'</option>').join("")+'</select>';box.appendChild(row)};
$("saveSchedule").onclick=async()=>{const times=[...document.querySelectorAll(".stime")],sels=[...document.querySelectorAll(".svid")];const items=sels.map((s,i)=>({videoId:Number(s.value),startTime:times[i].value.trim()}));try{await api("/api/admin/schedule",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});$("scheduleMsg").textContent="Programación guardada.";await loadSchedule()}catch(e){$("scheduleMsg").textContent=e.message}};
$("refresh").onclick=loadAll;$("search").oninput=()=>{videoPage=0;renderVideos()};$("prev").onclick=()=>{videoPage--;renderVideos()};$("next").onclick=()=>{videoPage++;renderVideos()};
function fmt(s){s=Number(s||0);if(!s)return"Duración no registrada";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return (h?h+":":"")+(h?String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
boot();
</script>
</body></html>
