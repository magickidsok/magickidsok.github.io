<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03164b"><title>Magic Kids · Panel privado</title><link rel="stylesheet" href="magic-public.css"><style>.admin{max-width:980px;margin:18px auto 50px}.lock{max-width:430px;margin:50px auto}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#061333;color:#fff;margin:5px 0 9px}label{font-size:.82rem;color:var(--muted);font-weight:800}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{max-height:420px;overflow:auto}.admin-row{padding:10px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.danger{background:#6b1830!important}.pill{font-size:.72rem;color:var(--muted)}@media(max-width:760px){.admin-grid{grid-template-columns:1fr}}</style></head><body><main class="container admin"><div class="brand"><img src="assets/magic-kids-logo.webp" alt="Magic Kids" style="width:min(300px,72vw)"></div><div id="lock" class="card lock"><h2>Panel privado</h2><p class="small">Solo el administrador puede entrar.</p><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="login" class="btn primary" style="width:100%">ENTRAR</button><div id="loginMsg" class="small" style="margin-top:8px"></div></div><section id="panel" class="hidden"><div class="admin-grid"><div class="card"><h2>Reproductor</h2><label>URL MP4</label><input id="playerUrl" class="field" placeholder="https://.../video.mp4"><label>ESTAMOS VIENDO</label><input id="nowLabel" class="field" placeholder="Magic Kids TV"><label>MÁS TARDE</label><input id="laterLabel" class="field" placeholder="Próximamente"><button id="saveSettings" class="btn primary">GUARDAR</button><div id="saveMsg" class="small" style="margin-top:8px"></div></div><div class="card"><h2>Enviar como MAGIC</h2><input id="adminMsg" class="field" maxlength="240" placeholder="Mensaje del administrador"><button id="sendAdmin" class="btn primary">PUBLICAR</button><div id="adminMsgStatus" class="small" style="margin-top:8px"></div></div><div class="card"><h2>Chat</h2><div id="adminMessages" class="table"></div><button id="clearChat" class="btn danger" style="margin-top:10px">BORRAR TODO EL CHAT</button><div id="chatAdminStatus" class="small" style="margin-top:8px"></div></div><div class="card"><h2>Bloqueos por IP</h2><p class="small">Se muestra un hash de IP para bloquear/revertir el acceso sin exponer la IP real.</p><div id="bans" class="table"></div></div></div></section></main><script src="magic-config.js"></script><script src="magic-admin.js" defer></script></body></html>
