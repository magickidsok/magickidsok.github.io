<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061747"><title>Programación · MAGIC KIDS</title><link rel="stylesheet" href="magic-kids-rebuild.css"></head><body><header class="site-header"><div class="wrap"><a class="brand" href="./"><img src="assets/magic-kids-logo.webp" alt="MAGIC KIDS"></a><p class="tagline">PROGRAMACIÓN DIARIA</p><nav class="main-nav"><a href="./">INICIO</a><a href="panel-programacion.html">PANEL PROGRAMACIÓN</a><a href="premium-beneficios.html">BENEFICIOS</a></nav></div></header><main class="wrap page-content"><section class="subpage-hero"><h1>PROGRAMACIÓN MAGIC KIDS</h1><p>Esta lista se consulta desde la programación guardada en el panel privado. Actualiza los datos sin reiniciar ni recargar el reproductor.</p></section><section class="panel content-panel"><div id="schedule-status" class="notice">Cargando programación…</div><div id="schedule-list" class="schedule-list"></div><button class="btn btn-blue" id="refresh">ACTUALIZAR LISTA</button></section></main><footer class="site-footer"><div class="wrap footer-inner"><span>MAGIC KIDS · FORMOSA, ARGENTINA</span><a href="./">Volver al inicio</a></div></footer><script>
const API="https://uifchrnvigkzantaehgz.supabase.co/functions/v1/mk-program-schedule?action=read";const el=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(){const s=el("schedule-status"),l=el("schedule-list");s.className="notice";s.textContent="Cargando…";try{const r=await fetch(API,{cache:"no-store"}),d=await r.json();if(!r.ok||!d.ok)throw new Error();const list=d.entries||[];l.innerHTML=list.map((x,i)=>'<div class="schedule-row"><span class="schedule-order">'+(i+1)+'</span><time>'+esc(x.start_time)+'</time><strong>'+esc(x.title)+'</strong></div>').join("")||'<p class="muted">La programación todavía no fue publicada.</p>';s.className="notice success";s.textContent="Última actualización: "+(d.revision?new Date(d.revision).toLocaleString("es-AR"):"disponible")}catch(e){s.className="notice error";s.textContent="La programación está temporalmente indisponible."}}
el("refresh").onclick=load;load();
</script></body></html>
