<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Magic Kids — WebTV</title><link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#07031f;color:#fff;font:15px Arial,Segoe UI,sans-serif}.wrap{width:min(1200px,calc(100% - 24px));margin:auto;padding:18px 0 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #38256f;padding:8px 0 16px}.logo{font-size:29px;font-weight:900;color:#ffd21b}.sub{color:#aeb4cf;font-size:12px;margin-top:4px}.pill{border:1px solid #6d4bc0;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900;color:#fff;text-decoration:none}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{border:1px solid #49358b;background:#0d082b;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.tabs button.active{background:#7436ff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{background:#100834;border:1px solid #3b2475;border-radius:14px;padding:11px}.thumb{aspect-ratio:16/9;background:#05030f;border-radius:9px;display:grid;place-items:center;border:1px solid #2e205e}.thumb span{font-weight:900;color:#ffd21b}.card h3{margin:10px 0 4px;font-size:15px}.meta{color:#969cb7;font-size:10px}.empty{text-align:center;color:#969cb7;padding:60px 10px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:14px;z-index:99}.player{width:min(960px,96vw);background:#0a0629;border-radius:14px;padding:12px}.player video{width:100%;background:#000;max-height:80vh}.close{float:right;background:#b52b35;border:0;border-radius:8px;padding:9px 12px;color:#fff;font-weight:900;margin-bottom:8px;cursor:pointer}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header class="top"><div><div class="logo">MAGIC KIDS</div><div class="sub">WEBTV · Video bajo demanda · MP4 directo · HTTP Range / 206</div></div><a class="pill" href="/panel-b2-direct.html">PANEL</a></header><nav id="tabs" class="tabs"></nav><main id="grid" class="grid"></main></div><div id="overlay" class="overlay"><div class="player"><button id="close" class="close">CERRAR</button><video id="video" controls playsinline></video></div></div><script src="https://cdn.plyr.io/3.8.4/plyr.min.js"></script><script>
const BUCKET="magic-kids-media-1991",ENDPOINT="https://s3.us-west-004.backblazeb2.com",CATALOG="https://"+BUCKET+"."+ENDPOINT.replace(/^https?:\/\//,"")+"/catalog.json";const $=id=>document.getElementById(id);let videos=[],active="Todas",player=null;
async function load(){try{const r=await fetch(CATALOG+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();videos=Array.isArray(d.videos)?d.videos:[]}catch(e){$("grid").innerHTML='<div class="empty">No se pudo cargar el catálogo todavía.</div>';return}renderTabs();render()}
function renderTabs(){const cats=["Todas",...new Set(videos.map(v=>v.category||"Otros"))];$("tabs").innerHTML=cats.map(c=>'<button class="'+(c===active?"active":"")+'" onclick="window.setCat('+JSON.stringify(c)+')">'+esc(c)+'</button>').join("")}
window.setCat=c=>{active=c;renderTabs();render()}
function render(){const xs=active==="Todas"?videos:videos.filter(v=>v.category===active);$("grid").innerHTML=xs.map(v=>'<article class="card"><div class="thumb"><span>MAGIC KIDS<br><small>MP4 · 206</small></span></div><h3>'+esc(v.title)+'</h3><div class="meta">'+esc(v.category)+' · '+time(v.durationSeconds)+'</div><button style="width:100%;margin-top:9px;border:0;border-radius:9px;padding:10px;background:#7436ff;color:#fff;font-weight:900;cursor:pointer" onclick="window.play('+JSON.stringify(v.url)+')">▶ REPRODUCIR</button></article>').join("")||'<div class="empty">Todavía no hay videos publicados.</div>'}
window.play=url=>{$("overlay").style.display="flex";$("video").src=url;if(player)player.destroy();player=new Plyr("#video",{controls:["play-large","play","progress","current-time","mute","volume","settings","fullscreen"],settings:["speed"],speed:{selected:1,options:[.75,1,1.25,1.5,2]}});$("video").play().catch(()=>{})};$("close").onclick=()=>{if(player){player.destroy();player=null}$("video").pause();$("video").removeAttribute("src");$("video").load();$("overlay").style.display="none"};function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function time(s){if(!Number.isFinite(Number(s)))return"duración pendiente";s=Math.max(0,Math.round(s));return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}load();
</script></body></html>
